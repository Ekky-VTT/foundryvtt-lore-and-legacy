<form class="{{cssClass}} flexcol" autocomplete="off" style="height: 100%; display: flex; flex-direction: column; overflow: hidden;">
    
    <!-- EN-TÊTE FIXE -->
    <header class="sheet-header" style="flex: 0 0 auto; display: flex; gap: 10px; margin-bottom: 10px; border-bottom: 2px solid #c19a5b; padding-bottom: 10px;">
        <img src="{{item.img}}" data-edit="img" title="{{item.name}}" style="width: 64px; height: 64px; object-fit: cover; border-radius: 5px; background: rgba(0,0,0,0.3);"/>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
            <h1 style="margin: 0; border: none;">
                <input name="name" type="text" value="{{item.name}}" placeholder="Nom de la relique" style="color: white; font-weight: bold; background: rgba(0, 0, 0, 0.2); border: 1px solid transparent; width: 100%; padding-left: 5px; border-radius: 3px;"/>
            </h1>
            <div style="display: flex; gap: 15px; align-items: center; margin-top: 5px; font-size: 12px; font-weight: bold;">
                <label style="display: flex; align-items: center; gap: 5px;">Quantité: <input type="number" name="system.quantite" value="{{system.quantite}}" min="0" style="width: 40px; text-align: center;"/></label>
                <label style="display: flex; align-items: center; gap: 5px;">Bagage: <input type="number" name="system.encombrement" value="{{system.encombrement}}" min="0" style="width: 40px; text-align: center;"/></label>
                <label style="display: flex; align-items: center; gap: 5px;">Prix (Taels): <input type="number" name="system.prix" value="{{system.prix}}" min="0" style="width: 50px; text-align: center;"/></label>
                <label style="display: flex; align-items: center; gap: 5px; color: #b32424; cursor: pointer;"><input type="checkbox" name="system.equipe" {{checked system.equipe}}/> ÉQUIPÉ</label>
            </div>
        </div>
    </header>

    <div class="sheet-content" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; overflow-y: hidden;">
        
        <!-- SPÉCIFICITÉS ARCANOTECH -->
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.05); border: 1px solid #c19a5b; border-radius: 3px; padding: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label style="font-weight: bold; color: #4a2c66;">Mystère :</label>
                    <input type="number" name="system.mystere" value="{{system.mystere}}" min="0" style="width: 40px; text-align: center; border: 1px solid #4a2c66;"/>
                </div>
                <label style="display: flex; align-items: center; gap: 5px; font-weight: bold; color: #4a2c66; cursor: pointer;">
                    <input type="checkbox" name="system.identifie" {{checked system.identifie}}/> IDENTIFIÉ
                </label>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label style="font-weight: bold;">Type :</label>
                    <select name="system.sousType" style="width: 130px;">
                        <option value="armeMelee" {{#if (eq system.sousType "armeMelee")}}selected{{/if}}>Arme de Mêlée</option>
                        <option value="armeTir" {{#if (eq system.sousType "armeTir")}}selected{{/if}}>Arme de Tir</option>
                        <option value="artefact" {{#if (eq system.sousType "artefact")}}selected{{/if}}>Artefact</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; justify-content: space-around; align-items: center; border-top: 1px dotted #c19a5b; padding-top: 5px;">
                <div style="display: flex; align-items: center; gap: 5px;" title="Utilisé si l'objet est une arme">
                    <label style="font-weight: bold;">Dégâts :</label>
                    <input type="text" name="system.degatsBase" value="{{system.degatsBase}}" style="width: 50px; text-align: center;"/>
                    <span style="font-weight: bold;">+</span>
                    <input type="number" name="system.degatsBonus" value="{{system.degatsBonus}}" style="width: 40px; text-align: center;"/>
                </div>
                <div style="display: flex; align-items: center; gap: 5px;" title="Utilisé si l'objet est un artefact (fragile)">
                    <label style="font-weight: bold;">Durabilité :</label>
                    <input type="number" name="system.durabilite" value="{{system.durabilite}}" style="width: 40px; text-align: center;"/>
                </div>
            </div>
        </div>

        <div class="form-group" style="flex: 1 1 auto; display: flex; flex-direction: column; margin-top: 5px; min-height: 150px;">
            <label style="font-weight: bold; margin-bottom: 5px; flex: 0 0 auto; color: #0e3a47; border-bottom: 1px solid #c19a5b;">Description & Effets :</label>
            <div style="flex: 1 1 auto; position: relative;">
                {{editor enrichedDescription target="system.description" button=true owner=owner editable=editable engine="prosemirror"}}
            </div>
        </div>
    </div>
</form>
