<form class="{{cssClass}} flexcol" autocomplete="off" style="height: 100%; display: flex; flex-direction: column; overflow: hidden;">
    
    <!-- LE HACK CSS : Force l'éditeur de Foundry à occuper l'espace sans s'effondrer -->
    <style>
        .lore-editor-fix { flex: 1 1 auto; display: flex; flex-direction: column; }
        .lore-editor-fix .editor { height: 100%; display: flex; flex-direction: column; }
        .lore-editor-fix .editor-content { flex: 1; overflow-y: auto; padding: 5px; border: 1px solid #ccc; border-radius: 3px; }
        .lore-editor-fix .tox-tinymce { height: 100% !important; }
        .lore-editor-fix .proseMirror { height: 100% !important; overflow-y: auto; }
    </style>

    <!-- EN-TÊTE FIXE -->
    <header class="sheet-header" style="flex: 0 0 auto; display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #c19a5b; padding-bottom: 10px;">
        <img src="{{item.img}}" data-edit="img" title="{{item.name}}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: rgba(0,0,0,0.3);"/>
        <h1 style="flex: 1; margin: 0;">
            <input name="name" type="text" value="{{item.name}}" placeholder="Nom de la capacité" style="color: white; font-weight: bold; background: rgba(0, 0, 0, 0.2); border: 1px solid transparent; width: 100%; padding-left: 5px; border-radius: 3px;"/>
        </h1>
    </header>

    <!-- CORPS DE LA FICHE -->
    <div class="sheet-content" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; overflow-y: hidden;">
        
        <!-- RÉGLAGES FIXES -->
        <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <label style="font-weight: bold; color: #1a252c;">Attribut Lié :</label>
            <select name="system.attributLie" style="width: 150px;">
                <option value="caractere" {{#if (eq system.attributLie "caractere")}}selected{{/if}}>Caractère</option>
                <option value="discernement" {{#if (eq system.attributLie "discernement")}}selected{{/if}}>Discernement</option>
                <option value="maitrise" {{#if (eq system.attributLie "maitrise")}}selected{{/if}}>Maîtrise</option>
                <option value="prestance" {{#if (eq system.attributLie "prestance")}}selected{{/if}}>Prestance</option>
                <option value="robustesse" {{#if (eq system.attributLie "robustesse")}}selected{{/if}}>Robustesse</option>
                <option value="vigueur" {{#if (eq system.attributLie "vigueur")}}selected{{/if}}>Vigueur</option>
                <option value="aucun" {{#if (eq system.attributLie "aucun")}}selected{{/if}}>Aucun (ex: Passion)</option>
            </select>
        </div>

        <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <label style="font-weight: bold; color: #1a252c;">Capacité Passive (P) :</label>
            <input type="checkbox" name="system.passif" {{checked system.passif}}/>
        </div>

        <!-- ZONE DE DESCRIPTION ÉTIRABLE AVEC LA CLASSE DE CORRECTION -->
        <div class="form-group lore-editor-fix" style="margin-top: 10px; min-height: 200px;">
            <label style="font-weight: bold; margin-bottom: 5px; flex: 0 0 auto; color: #1a252c;">Description :</label>
            
            <div class="description-container">
				{{editor enrichedDescription target="system.description" button=true editable=editable engine="prosemirror"}}
			</div>
        </div>
        
    </div>
</form>
